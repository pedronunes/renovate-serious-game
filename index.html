<html lang="en">

  <meta name="description" content="Official RENOVATE Serious Game on pesticide sprayer calibration for vineyard and orchard crops.">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFCC66">
  
  <!-- Apple iOS Mobile Full-Screen App Meta Tags (Hides Safari Address Bar & Navigation) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RENOVATE">
  <link rel="apple-touch-icon" href="public/images/pwa-icon-192.png">

  <!-- Premium Google Fonts: Montserrat, Outfit & Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,700,0,0">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>

  <!-- Cache-Busted Master Stylesheet v2.1.4 -->
  <link rel="stylesheet" href="styles.css?v=2.1.4.037">
</head>
<body>

  <!-- Main 9:16 Aspect Ratio Game Container -->
  <div id="game-container">
    
    <!-- RENOVATE Official Gold Top Bar -->
    <div id="top-bar" class="top-nav-bar"></div>

    <!-- Slide Backdrop Layer (Layer 1) -->
    <div id="slide-viewport" class="slide-screen"></div>

    <!-- UI Overlay Layer (Layer 2) -->
    <div id="ui-overlay" class="ui-overlay"></div>

    <!-- Integrated Elegant Bottom Navigation Bar -->
    <div id="bottom-nav" class="bottom-nav-bar"></div>

    <!-- Session Recovery Modal Container Overlay (Layer 3) -->
    <div id="modal-container"></div>

  </div>

  <!-- Mobile Landscape Orientation Blocker (Template C - Design Bible v6) -->
  <div id="orientation-blocker">
    <div class="blocker-content">
      <div class="rotate-icon">📱🔄</div>
      <h2>Por favor, rode o seu dispositivo</h2>
      <p>O Serious Game RENOVATE corre exclusivamente na orientação vertical para garantir a melhor experiência pedagógica.</p>
    </div>
  </div>

  <!-- Cache-Busted Main Game Engine v2.1.4 -->
  <script src="app.js?v=2.1.4.037"></script>

  <!-- Service Worker Registration for PWA Standalone App Experience -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=2.1.4.037')
          .then(reg => {
            console.log('PWA ServiceWorker active v2.1.4:', reg.scope);
            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('New PWA update detected, auto-reloading...');
                    window.location.reload();
                  }
                };
              }
            };
          })
          .catch(err => console.error('PWA ServiceWorker error:', err));
      });
    }
  </script>

</body>
</html>
